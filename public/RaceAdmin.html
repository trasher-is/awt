<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Hub - Race Evidence</title>
    <!-- Pinned: the unversioned URL served whatever the CDN considered current, so a new
         major release would have broken this page with no change on our side. No SRI
         here because this endpoint tailors its response (plugins/config query). -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(240 3.7% 15.9%)",
                        input: "hsl(240 3.7% 15.9%)",
                        ring: "hsl(240 4.9% 83.9%)",
                        background: "hsl(240 10% 3.9%)",
                        foreground: "hsl(0 0% 98%)",
                        primary: { DEFAULT: "hsl(0 0% 98%)", foreground: "hsl(240 5.9% 10%)" },
                        secondary: { DEFAULT: "hsl(240 3.7% 15.9%)", foreground: "hsl(0 0% 98%)" },
                        muted: { DEFAULT: "hsl(240 3.7% 15.9%)", foreground: "hsl(240 5% 64.9%)" },
                        destructive: { DEFAULT: "hsl(0 62.8% 30.6%)", foreground: "hsl(0 0% 98%)" },
                        card: { DEFAULT: "hsl(240 10% 3.9%)", foreground: "hsl(0 0% 98%)" },
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: hsl(240 10% 3.9%); display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen text-foreground font-sans selection:bg-primary selection:text-primary-foreground pb-20">

    <header class="sticky top-0 z-50 w-full border-b border-border bg-background/95 backdrop-blur">
        <div class="container mx-auto flex h-14 items-center px-4 justify-between">
            <div class="flex items-center gap-2 font-semibold text-destructive">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Race Evidence</span>
            </div>
            <nav class="flex items-center gap-4 text-sm">
                <a href="/admin" class="text-muted-foreground hover:text-foreground transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Command Center</a>
                <button onclick="logout()" class="text-destructive hover:text-destructive/80 transition-colors font-medium">Terminate Session</button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8 max-w-6xl fade-in mt-4 flex flex-col gap-8"></main>

    <!-- race-admin.js appends its section to <main> and loads once the admin check below shows the page. -->
    <script type="module" src="/hub-assets/js/ui/race-admin.js"></script>
    <script>
        async function initRaceAdmin() {
            try {
                const response = await fetch('/hub-api/me');
                const data = await response.json();
                if (data.id && data.role === 'admin') {
                    document.body.style.display = 'block';
                    window.loadRaceAdmin?.();
                } else {
                    window.location.href = '/dashboard';
                }
            } catch (e) {
                window.location.href = '/hub-assets/login.html';
            }
        }
        initRaceAdmin();

        function logout() {
            fetch('/hub-api/logout', { method: 'POST' }).then(() => { window.location.href = '/hub-assets/login.html'; });
        }
    </script>
</body>
</html>
