<div id="shared-intel-panel" class="fixed top-0 right-0 h-full w-full md:w-[calc(100%-3.5rem)] bg-black border-l border-border transform translate-x-full transition-transform duration-300 z-40 flex flex-col shadow-2xl">

    <div class="h-14 border-b border-border flex items-center justify-between px-6 bg-zinc-900 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-md bg-white/5 flex items-center justify-center text-primary">
                <i class="fa-solid fa-people-arrows text-base"></i>
            </div>
            <div>
                <h2 class="font-bold text-foreground tracking-wide">Shared Intel</h2>
                <p class="text-sm text-muted-foreground hidden sm:block">What partner alliances' hubs share with us — their members' observations, not ours</p>
            </div>
        </div>
        <button id="shared-intel-close-btn" class="w-8 h-8 rounded-md hover:bg-accent flex items-center justify-center text-muted-foreground hover:text-foreground transition-colors">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>

    <div class="p-4 border-b border-border bg-zinc-950 flex flex-wrap items-center gap-3 shrink-0">
        <select id="shared-intel-kind" class="h-9 px-2 rounded-md bg-zinc-900 border border-border text-sm"></select>
        <select id="shared-intel-source" class="h-9 px-2 rounded-md bg-zinc-900 border border-border text-sm">
            <option value="">All partners</option>
        </select>
        <input id="shared-intel-search" type="text" placeholder="Name, tag or id..."
               class="h-9 px-3 rounded-md bg-zinc-900 border border-border text-sm w-52 focus:outline-none focus:ring-1 focus:ring-ring">
        <span id="shared-intel-status" class="text-xs text-muted-foreground"></span>
    </div>

    <div class="flex-1 overflow-auto">
        <table class="w-full text-sm">
            <thead id="shared-intel-head" class="sticky top-0 bg-zinc-900 text-muted-foreground text-xs uppercase"></thead>
            <tbody id="shared-intel-body"></tbody>
        </table>
    </div>
</div>
