<div id="battle-reports-panel" class="absolute top-0 left-0 md:left-14 right-0 h-full bg-background/95 backdrop-blur-md border-l border-border z-40 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="h-14 border-b border-border flex items-center justify-between px-6 bg-card shrink-0">
        <div class="flex items-center gap-3 text-foreground font-semibold"><i class="fa-solid fa-explosion text-aw-enemy text-xl"></i><span class="tracking-wider uppercase">Battle Reports</span></div>
        <button id="battle-reports-close-btn" class="text-muted-foreground hover:text-foreground transition-colors p-2 rounded hover:bg-accent"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="flex-1 overflow-hidden flex flex-col p-4 md:p-6 gap-4">
        <div class="flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2 flex-1 min-w-[200px] max-w-sm">
                <i class="fa-solid fa-magnifying-glass text-muted-foreground text-xs"></i>
                <input id="battle-reports-search-input" type="text" placeholder="Search player, alliance, or system…"
                       class="flex-1 bg-input border border-border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
            <div class="text-xs text-muted-foreground hidden md:block">Battles link to the game's own report. A population drop with no matching report shows without a link. Click a column to sort.</div>
            <div class="text-sm text-muted-foreground font-mono whitespace-nowrap">Showing <span id="battle-reports-result-count" class="text-foreground font-bold">0</span> of <span id="battle-reports-total-count" class="text-foreground font-bold">0</span></div>
        </div>
        <div class="flex-1 overflow-auto border border-border rounded-lg bg-card relative shadow-sm">
            <table class="w-full md:w-auto text-left text-sm whitespace-nowrap">
                <thead class="sticky top-0 bg-secondary text-secondary-foreground shadow-sm z-10">
                    <tr>
                        <th class="p-3 cursor-pointer select-none hover:text-foreground" data-sort-key="occurred_at">When <span class="sort-arrow"></span></th>
                        <th class="p-3">System</th>
                        <th class="p-3">Attacker</th>
                        <th class="p-3">Defender</th>
                        <th class="p-3 cursor-pointer select-none hover:text-foreground" data-sort-key="cv">CV <span class="sort-arrow"></span></th>
                        <th class="p-3 cursor-pointer select-none hover:text-foreground" data-sort-key="pop">Population <span class="sort-arrow"></span></th>
                        <th class="p-3">Report</th>
                    </tr>
                </thead>
                <tbody id="battle-reports-table-body" class="divide-y divide-border"></tbody>
            </table>
        </div>
    </div>
</div>
