<div id="battle-reports-panel" class="absolute top-0 left-0 md:left-14 right-0 h-full bg-background/95 backdrop-blur-md border-l border-border z-40 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="h-14 border-b border-border flex items-center justify-between px-6 bg-card shrink-0">
        <div class="flex items-center gap-3 text-foreground font-semibold"><i class="fa-solid fa-explosion text-aw-enemy text-xl"></i><span class="tracking-wider uppercase">Battle Reports</span></div>
        <button id="battle-reports-close-btn" class="text-muted-foreground hover:text-foreground transition-colors p-2 rounded hover:bg-accent"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="flex-1 overflow-hidden flex flex-col p-4 md:p-6 gap-4">
        <div class="flex justify-between items-center gap-4">
            <div class="text-xs text-muted-foreground">Battles link to the game's own report. A population drop with no matching report shows without a link.</div>
            <div class="text-sm text-muted-foreground font-mono">Showing <span id="battle-reports-result-count" class="text-foreground font-bold">0</span> events</div>
        </div>
        <div class="flex-1 overflow-auto border border-border rounded-lg bg-card relative shadow-sm">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="sticky top-0 bg-secondary text-secondary-foreground shadow-sm z-10">
                    <tr>
                        <th class="p-3">When</th>
                        <th class="p-3">System</th>
                        <th class="p-3">Attacker</th>
                        <th class="p-3">Defender</th>
                        <th class="p-3">Population</th>
                        <th class="p-3">Report</th>
                    </tr>
                </thead>
                <tbody id="battle-reports-table-body" class="divide-y divide-border"></tbody>
            </table>
        </div>
    </div>
</div>
