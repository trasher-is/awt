<div id="settings-panel" class="fixed top-0 right-0 h-full w-full md:w-[calc(100%-3.5rem)] bg-black border-l border-border transform translate-x-full transition-transform duration-300 z-40 flex flex-col shadow-2xl">

    <div class="h-14 border-b border-border flex items-center justify-between px-4 md:px-6 bg-zinc-900 shrink-0">
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-md bg-white/5 flex items-center justify-center text-primary shrink-0">
                <i class="fa-solid fa-sliders text-base"></i>
            </div>
            <div class="min-w-0">
                <h2 class="font-bold text-foreground tracking-wide">Settings</h2>
                <p class="text-sm text-muted-foreground truncate">Choose what the hub shows you</p>
            </div>
        </div>
        <button id="settings-close-btn" class="w-8 h-8 rounded-md hover:bg-accent flex items-center justify-center text-muted-foreground hover:text-foreground transition-colors shrink-0" aria-label="Close settings">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto bg-black">
        <div id="settings-body" class="max-w-3xl mx-auto px-4 md:px-6 py-5"></div>
    </div>

    <div class="border-t border-border bg-zinc-950 px-4 md:px-6 py-3 shrink-0">
        <div class="max-w-3xl mx-auto flex flex-wrap items-center gap-x-4 gap-y-2">
            <div id="settings-reload-note" class="hidden items-center gap-2 text-sm text-muted-foreground">
                <span>Extras change on the next page load.</span>
                <button id="settings-reload-btn" type="button" class="inline-flex items-center gap-2 h-9 px-3 rounded-md bg-white text-black font-medium hover:bg-white/90 transition-colors text-sm shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-rotate"></i> Reload game page
                </button>
            </div>
            <span id="settings-status" class="text-sm text-muted-foreground" role="status"></span>
            <button id="settings-reset-btn" type="button" class="ml-auto inline-flex items-center h-9 px-3 rounded-md border border-input text-sm text-muted-foreground hover:bg-accent hover:text-foreground transition-colors whitespace-nowrap">
                Restore defaults
            </button>
        </div>
    </div>
</div>
